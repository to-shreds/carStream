name: Verified baseline import
on:
  push:
    paths: ['.github/workflows/import-baseline.yml']
permissions:
  contents: write
concurrency:
  group: baseline-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare private one-time transport
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/src/main/AndroidManifest.xml
          git config user.name 'CarStream migration'
          git config user.email 'carstream-migration@users.noreply.github.com'
          mkdir -p migration
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/migration-key.pem" 2>/dev/null
          chmod 600 "$RUNNER_TEMP/migration-key.pem"
          openssl pkey -in "$RUNNER_TEMP/migration-key.pem" -pubout -out migration/transport-public.pem
          git add migration/transport-public.pem
          git commit -m 'Publish ephemeral migration transport public key'
          git push origin HEAD:main
          ready=false
          for attempt in $(seq 1 120); do
            git fetch origin main --quiet
            if git show origin/main:migration/envelope.json > "$RUNNER_TEMP/envelope.json" 2>/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          git reset --hard origin/main
      - name: Verify and import the exact original source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, shutil, stat, subprocess, urllib.parse, urllib.request, zipfile
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          envelope = json.loads((temp/'envelope.json').read_text())
          expected = {'source': ('CarStream-Source-v1.5.0.zip', 'cc05a9428424ac347cbef4b700f98970c808e11fc047c7ef41117c029dd2e553'), 'apk': ('CarStream-v1.5.0.apk', '08f7660124bf88e6e52c3d00df7efee2cbbb1326d22ebe85861498ba33ff6518')}
          for label, (name, digest) in expected.items():
              ciphertext = temp/(label+'.cipher')
              ciphertext.write_bytes(base64.b64decode(envelope[label], validate=True))
              url = subprocess.check_output(['openssl','pkeyutl','-decrypt','-inkey',str(temp/'migration-key.pem'),'-in',str(ciphertext),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256']).decode()
              u = urllib.parse.urlsplit(url)
              assert u.scheme == 'https' and u.hostname == 'raw.githubusercontent.com'
              assert u.path == '/to-shreds/ProjectStatus/main/projects/carstream/artifacts/'+name
              assert u.username is None and u.password is None
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      data = response.read(2_000_001)
              except Exception:
                  raise SystemExit('Unable to retrieve hash-pinned '+label+'; download address was not logged') from None
              assert len(data) <= 2_000_000 and hashlib.sha256(data).hexdigest() == digest
              (temp/name).write_bytes(data)
              print(label+' SHA-256 verified: '+digest)
          (temp/'migration-key.pem').unlink()
          (temp/'envelope.json').unlink()
          archive = zipfile.ZipFile(temp/expected['source'][0])
          assert archive.testzip() is None
          prefix = 'CarStream-Source-v1.5.0/'
          files = {}
          staged = temp/'verified-source'
          staged.mkdir()
          checks = [rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', rb'gh[pousr]_[A-Za-z0-9_]{25,}', rb'github_pat_[A-Za-z0-9_]{25,}', rb'AKIA[0-9A-Z]{16}', rb'(?i)(?:api_?key|password|bearer|token)\s*[:=]\s*[\"\x27][A-Za-z0-9+/=_-]{24,}[\"\x27]']
          for entry in archive.infolist():
              if entry.is_dir():
                  continue
              assert entry.filename.startswith(prefix)
              relative = pathlib.PurePosixPath(entry.filename[len(prefix):])
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
              assert not stat.S_ISLNK(entry.external_attr >> 16)
              assert relative.suffix.lower() not in {'.jks','.keystore','.p12','.pem','.key'}
              data = archive.read(entry)
              assert not any(re.search(pattern, data) for pattern in checks), 'Credential-like content in '+str(relative)
              assert str(relative) not in files
              files[str(relative)] = {'sha256':hashlib.sha256(data).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest(),'bytes':len(data)}
              destination = staged/relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          assert len(files) == 72
          assert not pathlib.Path('app').exists()
          for relative in files:
              destination = pathlib.Path(relative)
              if destination.exists():
                  assert destination.read_bytes() == (staged/relative).read_bytes(), 'Existing file differs: '+relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(staged/relative, destination)
          pathlib.Path('docs').mkdir(exist_ok=True)
          provenance = {'source_repository':'to-shreds/ProjectStatus','source_path':'projects/carstream/artifacts/CarStream-Source-v1.5.0.zip','source_sha256':expected['source'][1],'baseline_apk_sha256':expected['apk'][1],'package':'com.carstream.app','version':'1.5.0','version_code':25,'signing_certificate_sha256':'57097bb3ab2cc2d64276801127f396bd2455894b6c18025aff48e26f9612d116','files':files}
          pathlib.Path('docs/baseline-provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          pathlib.Path('.gitignore').write_text('.gradle/\n.gradle-user-home/\nbuild/\nbuild-standalone/\n**/build/\nlocal.properties\n*.jks\n*.keystore\n*.p12\n*.pem\n*.key\n.env\n.env.*\n!*.example\nnode_modules/\n__pycache__/\n*.apk\n*.idsig\n')
          shutil.rmtree('migration')
          print('72 original files imported without modification; no signing key or plaintext download credentials included.')
          PY
          git add -A
          git commit -m 'Import exact verified CarStream v1.5.0 source baseline (72 unchanged files)'
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build from the imported repository and verify baseline
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ECJ_JAR="$RUNNER_TEMP/ecj.jar"
          export JSON_JAR="$RUNNER_TEMP/json.jar"
          curl -fsSL https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.33.0/ecj-3.33.0.jar -o "$ECJ_JAR"
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$JSON_JAR"
          export CARSTREAM_KEYSTORE="$RUNNER_TEMP/ci-only.jks"
          export CARSTREAM_KEY_ALIAS=ci-only
          export CARSTREAM_STORE_PASS="$(openssl rand -hex 24)"
          export CARSTREAM_KEY_PASS="$CARSTREAM_STORE_PASS"
          echo "::add-mask::$CARSTREAM_STORE_PASS"
          keytool -genkeypair -keystore "$CARSTREAM_KEYSTORE" -alias ci-only -storepass "$CARSTREAM_STORE_PASS" -keypass "$CARSTREAM_KEY_PASS" -dname 'CN=CI test only' -keyalg RSA -keysize 3072 -validity 1 >/dev/null 2>&1
          python scripts/build_release.py "$RUNNER_TEMP/ci-only.apk"
          python validation/run_stremio_test.py
          (cd validation && npm install --ignore-scripts --no-audit --no-fund && npm test)
          "$ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/CarStream-v1.5.0.apk"
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          baseline = zipfile.ZipFile(temp/'CarStream-v1.5.0.apk')
          rebuilt = zipfile.ZipFile(temp/'ci-only.apk')
          keys = sorted(name for name in baseline.namelist() if name.startswith('assets/'))
          assert keys == sorted(name for name in rebuilt.namelist() if name.startswith('assets/'))
          assert all(baseline.read(name) == rebuilt.read(name) for name in keys)
          print('All '+str(len(keys))+' packaged assets are byte-identical to the original signed APK.')
          exact_dex = baseline.read('classes.dex') == rebuilt.read('classes.dex')
          print('DEX byte identity:',exact_dex)
          report = {'source_files':72,'asset_files_byte_identical':len(keys),'dex_byte_identical':exact_dex,'original_signing_key_used':False,'ci_apk_distributable':False,'physical_device_tested':False,'baseline_commit':os.popen('git rev-parse HEAD').read().strip()}
          pathlib.Path('migration-report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          mkdir -p build-standalone/signing-tool
          cp "$ANDROID_BUILD_TOOLS/lib/apksigner.jar" build-standalone/signing-tool/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-verification
          path: |
            migration-report.json
            validation/stremio-results.json
            validation/logic-results.json
            build-standalone/aligned.apk
            build-standalone/signing-tool/apksigner.jar
          retention-days: 7
